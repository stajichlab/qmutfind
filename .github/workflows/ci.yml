name: CI

on:
  push:
    branches: [main]
  pull_request:

# Action versions are pinned to exact tags (checked on 2026-11-11).
jobs:
  test:
    name: Rust and Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          locked: true
          cache: true
      - run: pixi run test
      - run: pixi run test-bench

  wasm:
    name: WebAssembly toolchain and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          locked: true
          cache: true
      # No cache for .emsdk: it is 3.8 GB, and a fresh install took 44 s on the HPCC login node.
      - run: pixi run setup-emsdk
      - run: pixi run test-emsdk
      - run: pixi run build-wasm
      # Builds the Node package and the CLI, then checks that the WASM VCF equals the CLI VCF.
      - run: pixi run test-wasm
