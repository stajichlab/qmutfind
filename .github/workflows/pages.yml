name: Deploy site

# Builds the WebAssembly package and the landing page, then publishes it to GitHub Pages
# (https://qmutfind.fungalgenomes.org/). The custom domain is set in the repository's Pages settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Action versions are pinned to exact tags (checked on 2026-11-12).
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          locked: true
          cache: true
      - run: pixi run build-wasm-web
      - run: bash scripts/build-site.sh
        env:
          SITE_CNAME: qmutfind.fungalgenomes.org
      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
