<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qmutfind in the browser</title>
<style>
  :root { --bg: #ffffff; --fg: #1c1c1c; --muted: #595959; --line: #cfcfcf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181d; --fg: #e8e8e8; --muted: #a6a6a6; --line: #3a3d44; } }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; margin: 0 auto; max-width: 920px; padding: 16px; }
  label { display: block; margin: 10px 0 2px; font-weight: 600; }
  input, select, button { font: inherit; }
  small { color: var(--muted); }
  #status, #progress, #summary { margin: 8px 0; }
  iframe { width: 100%; height: 420px; border: 1px solid var(--line); margin-top: 12px; }
</style>
</head>
<body>
<h1>qmutfind in the browser</h1>
<p>Everything runs on your computer. No file leaves it. Build the package first with <code>pixi run build-wasm-web</code>
and serve this repository with a static server, for example <code>python3 -m http.server</code>.</p>

<label for="reference">Reference FASTA (plain or .gz)</label>
<input id="reference" type="file">
<label for="reads">Reads, FASTQ (plain or .gz). Choose one or more files. Each read is mapped on its own.</label>
<input id="reads" type="file" multiple>
<label for="gff">Genes, GFF3 (optional, plain or .gz)</label>
<input id="gff" type="file">
<label for="sample">Sample name</label>
<input id="sample" type="text" value="sample">
<label for="kind">Read type</label>
<select id="kind"><option value="short">Short reads (Illumina)</option><option value="long">Long reads (Nanopore)</option></select>
<label for="region">Region for the gene picture, for example NC_007198.1:3,851,000-3,854,000 (optional, needs the GFF)</label>
<input id="region" type="text" size="40">
<p><button id="run" type="button">Run</button></p>

<div id="status" role="status"></div>
<div id="progress"></div>
<div id="summary"></div>
<p><a id="download-vcf" hidden>Download the VCF</a> <a id="download-stats" hidden>Download the statistics (JSON)</a></p>
<iframe id="report" title="Gene and mutation picture"></iframe>
<script type="module" src="app.js"></script>
</body>
</html>
